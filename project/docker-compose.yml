services:
  python-api:
    build:
      context: ./server/src/services/analysis/python_api
      dockerfile: Dockerfile
    container_name: interview-python-api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REPORTS_DIR: /app/reports
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview-server
    environment:
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PYTHON_API_BASE_URL: http://python-api:8000
      REPORTS_DIR: /app/reports
    ports:
      - "3001:3001"
    volumes:
      - ./reports:/app/reports
    depends_on:
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: interview-client
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  hf-cache:
